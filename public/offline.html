<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>Offline - Sheheryar Fitness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #09090b;
      color: #f4f4f5;
      text-align: center;
    }
    main { max-width: 360px; display: grid; justify-items: center; gap: 1rem; }
    h1 { font-size: 1.6rem; }
    p { color: #b4b4bd; line-height: 1.5; }
    button {
      min-height: 44px;
      padding: 0 1.25rem;
      border: none;
      border-radius: 12px;
      background: #facc15;
      color: #121212;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #facc15; outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <!-- Inline so it shows without a connection -->
    <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" aria-hidden="true" viewBox="0 0 512 512"> <defs> <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#fde047"/> <stop offset="1" stop-color="#eab308"/> </linearGradient> </defs> <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/> <g transform="translate(106 106) scale(12.5)" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></g> </svg>
    <h1>You're offline</h1>
    <p>Sheheryar Fitness needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>

</html>
